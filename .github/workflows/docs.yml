name: Deploy docs

on:
  push:
    branches: [master]
    paths:
      - "docs-site/**"
      - "playground/**"
      - "examples/**"
      - "types/**"
      - "src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Root deps are needed by the playground build (TypeScript, CodeMirror, …).
      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install docs dependencies
        run: bun install --frozen-lockfile
        working-directory: docs-site

      # `prebuild` builds the playground bundle and copies it into public/playground.
      - name: Build site
        run: bun run build
        working-directory: docs-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
